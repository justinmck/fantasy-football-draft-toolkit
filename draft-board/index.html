<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Justin's Draft Assistant</title>
    <meta name="description" content="Live fantasy draft recommendations that account for your open roster slots, how long a player will last, and how much the projection can be trusted." />

    <!-- The tab icon. SVG first for the browsers that take it (it stays sharp
         at any density); the 32px PNG is the fallback, and apple-touch-icon is
         what iOS uses when the board is saved to a home screen for draft day. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Matches the app's own background, so the browser chrome and the page
         are the same color instead of meeting at a seam. -->
    <meta name="theme-color" content="#0a0e14" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-title" content="Draft Assistant" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta property="og:title" content="Justin's Draft Assistant" />
    <meta property="og:description" content="Live fantasy draft recommendations built on six seasons of your league's own history." />
    <meta property="og:type" content="website" />

    <!-- Painted before any JavaScript parses, so the first frame is the app's
         own background rather than white. Without it the browser shows a white
         canvas for the length of the bundle download, which on draft day reads
         as the tool having crashed. Removed by the app on mount. -->
    <style>
      html { background: #0a0e14; color-scheme: dark; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #0a0e14; color: #64748b;
        font: 500 14px/1.4 Poppins, ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      #boot svg { animation: boot-pulse 1.6s ease-in-out infinite; }
      @keyframes boot-pulse { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { #boot svg { animation: none } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 64 64" fill="none" stroke="#3b82f6"
           stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 15h20v11a10 10 0 0 1-20 0z" />
        <path d="M22 18h-5a5 5 0 0 0 5 8" />
        <path d="M42 18h5a5 5 0 0 1-5 8" />
        <path d="M32 36v8" />
        <path d="M24 49h16" />
      </svg>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
